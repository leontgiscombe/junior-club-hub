<!doctype html>
<!-- Shown by the app when the site can't be reached (capacitor.config.json server.errorPath). -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Connection</title>
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:linear-gradient(#15803d,#14532d);font-family:-apple-system,system-ui,sans-serif;color:#111}
  .card{background:#fff;border-radius:28px;padding:32px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .icon{font-size:44px}
  h1{font-size:22px;margin:12px 0 6px}
  p{color:#6b7280;font-size:15px;line-height:1.4;margin:0 0 22px}
  button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;color:#fff;background:#16a34a}
  @media (prefers-color-scheme: dark){.card{background:#1c1c1e;color:#f9fafb}p{color:#9ca3af}}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>No Connection</h1>
    <p>Club Hub needs the internet to fetch your club's latest. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.href='https://grassroots-club-hub.co.uk/start'">Try Again</button>
  </div>
</body>
</html>
