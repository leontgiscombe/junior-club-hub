# Render Blueprint: the app and its reminder job. In Render, New → Blueprint,
# pick this repo, and fill in the values marked sync: false when asked.
services:
  - type: web
    name: junior-club-hub
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Upstash Redis: the REST URL and token from the database's page
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
      # the domain clubs get a subdomain of, e.g. grassroots-club-hub.co.uk
      - key: ROOT_DOMAIN
        sync: false
      - key: PLATFORM_NAME
        value: Grassroots Club Hub
      # Financial Admin reminders (generate the pair with: npx web-push generate-vapid-keys)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # email (password resets, welcome emails) through Resend: an API key, and a
      # no-reply sender on a domain verified there, e.g. Grassroots Club Hub <noreply@grassroots-club-hub.co.uk>
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # for the privacy policy and terms: who runs the platform (a person's or
      # business's legal name) and where questions go (hello@…)
      - key: PLATFORM_OPERATOR
        sync: false
      - key: PLATFORM_CONTACT_EMAIL
        sync: false
      # the password for the platform admin page (/platform/admin), 12+ characters
      - key: PLATFORM_ADMIN_KEY
        sync: false
      # optional, recommended: a second Upstash database for the nightly backups
      # (its REST URL and token); without them, backups go in the main database
      - key: BACKUP_KV_REST_API_URL
        sync: false
      - key: BACKUP_KV_REST_API_TOKEN
        sync: false
      # optional: error reports to Sentry (the project's DSN, from sentry.io)
      - key: SENTRY_DSN
        sync: false
      # optional: the owner's password for changing the built-in drill library
      - key: TRAINING_PLANS_OWNER_KEY
        sync: false

  # Every day at 9am UTC: the nightly backup, plus the subs reminders on the
  # 1st and 15th of each month (scripts/run-reminders.mjs)
  - type: cron
    name: junior-club-hub-reminders
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: echo "nothing to build"
    startCommand: node scripts/run-reminders.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      # the web service's own address, e.g. https://junior-club-hub.onrender.com
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: junior-club-hub
          envVarKey: CRON_SECRET
